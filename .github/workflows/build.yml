name: Java CI with Maven

# Automatically triggered on push or pull request events.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    # Configures a job to set up Java
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    # Compile using Maven
    - name: Build with Maven
      working-directory: .
      run: mvn -B package --file pom.xml
